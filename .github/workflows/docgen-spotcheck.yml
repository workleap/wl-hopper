# Temporary workflow: generates the component data from main and from this branch, then compares a
# random sample of individual properties across the two. Delete once the result has been reported.
name: Docgen spot-check

on:
    workflow_dispatch:
        inputs:
            seed:
                description: "Seed for the random selection (blank picks a new one)"
                required: false
                type: string
    pull_request:
        branches: [ "main" ]

env:
    CI: true

permissions:
    contents: read

jobs:
    spotcheck:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout code
                uses: actions/checkout@v4
                with:
                    fetch-depth: 0

            -   name: Setup Node and PNPM
                uses: ./.github/composite-actions/setup

            -   name: Install dependencies
                run: pnpm i --frozen-lockfile

            -   name: Generate from main
                run: |
                    set -euo pipefail
                    BASE_SHA="${{ github.event.pull_request.base.sha }}"
                    if [ -z "$BASE_SHA" ]; then BASE_SHA="origin/main"; fi
                    SCRIPT="$GITHUB_WORKSPACE/apps/docs/scripts/generateComponentData.ts"

                    # `apps/docs/scripts/generateComponentData.ts` is the only file that differs from
                    # main, so restoring it reproduces exactly what main generates.
                    echo "Generating with the script from $BASE_SHA"
                    cp "$SCRIPT" /tmp/branch-script.ts
                    git show "$BASE_SHA:apps/docs/scripts/generateComponentData.ts" > "$SCRIPT"

                    rm -rf "$GITHUB_WORKSPACE/apps/docs/datas/components"
                    (cd "$GITHUB_WORKSPACE/apps/docs" && pnpm generate:componentData) > /tmp/from-main.log 2>&1 \
                        || (tail -30 /tmp/from-main.log; cp /tmp/branch-script.ts "$SCRIPT"; exit 1)
                    mv "$GITHUB_WORKSPACE/apps/docs/datas/components" /tmp/from-main

                    cp /tmp/branch-script.ts "$SCRIPT"
                    git diff --quiet -- "$SCRIPT" && echo "branch script restored"
                    echo "main produced $(ls /tmp/from-main | wc -l) files"

            -   name: Generate from this branch
                run: |
                    set -euo pipefail
                    rm -rf "$GITHUB_WORKSPACE/apps/docs/datas/components"
                    (cd "$GITHUB_WORKSPACE/apps/docs" && pnpm generate:componentData) > /tmp/from-branch.log 2>&1 \
                        || (tail -30 /tmp/from-branch.log; exit 1)
                    mv "$GITHUB_WORKSPACE/apps/docs/datas/components" /tmp/from-branch
                    echo "branch produced $(ls /tmp/from-branch | wc -l) files"

            -   name: Compare a random sample of properties
                env:
                    SPOTCHECK_SEED: ${{ inputs.seed }}
                run: node .github/workflows/scripts/spotCheckDocgen.mjs /tmp/from-main /tmp/from-branch

            -   name: Upload both outputs
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: docgen-output
                    path: |
                        /tmp/from-main
                        /tmp/from-branch
