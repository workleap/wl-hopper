name: Setup Node and PNPM

inputs:
    cache:
        description: Whether to restore and save the pnpm store. Leave it off in a job that publishes or runs an agent.
        required: false
        default: "false"

runs:
    using: composite
    steps:
      - name: Install pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          install: false
          cache: ${{ inputs.cache }}
