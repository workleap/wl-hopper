name: Claude Code

on:
    issue_comment:
        types: [created]
    pull_request_review_comment:
        types: [created]
    issues:
        types: [opened, assigned]
    pull_request_review:
        types: [submitted]

jobs:
    # The claude job holds credentials and runs the package scripts and the tool configuration of the thread's working tree.
    # It only starts when the person who mentioned @claude and the author of the issue or pull request both have write access,
    # and a pull request's branch is in this repository. This job holds no secret and checks out nothing.
    gate:
        if: |
            (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
            (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
            (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
            (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
        runs-on: ubuntu-latest
        permissions:
            pull-requests: read
        outputs:
            trusted: ${{ steps.thread.outputs.trusted }}
        steps:
            - name: Check who wrote the thread
              id: thread
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                  script: |
                      const { owner, repo } = context.repo;
                      const { sender, issue, pull_request: pullRequest } = context.payload;
                      const thread = pullRequest ?? issue;

                      async function canWrite(username) {
                          const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username });

                          return data.permission === "admin" || data.permission === "write";
                      }

                      async function isBranchInThisRepository() {
                          const { data } = await github.rest.pulls.get({ owner, repo, pull_number: thread.number });

                          return data.head.repo?.id === data.base.repo.id;
                      }

                      const isPullRequest = Boolean(pullRequest ?? issue.pull_request);
                      const trusted =
                          (await canWrite(sender.login)) &&
                          (await canWrite(thread.user.login)) &&
                          (!isPullRequest || (await isBranchInThisRepository()));

                      if (!trusted) {
                          core.notice(`Claude does not run on #${thread.number}: @${sender.login} or its author @${thread.user.login} has no write access, or the pull request's branch is in another repository.`);
                      }

                      core.setOutput("trusted", trusted);

    claude:
        needs: gate
        if: needs.gate.outputs.trusted == 'true'
        runs-on: workleap
        permissions:
            contents: read
            pull-requests: write
            issues: write
            id-token: write
            actions: read # Required for Claude to read CI results on PRs
        env:
            # Claude Code removes its OAuth token and the variables that request an OIDC token from the environment of the commands and hooks it starts.
            CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: 1
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1
                  # The job token is not kept on disk for the steps that run the working tree's scripts.
                  persist-credentials: false
            # The pnpm store is not restored or saved here: this job runs an agent, and the trusted jobs restore that store.
            - name: Setup Node and PNPM
              uses: ./.github/composite-actions/setup
            - name: Install dependencies
              run: pnpm i --frozen-lockfile
            - name: Run Claude Code
              id: claude
              uses: anthropics/claude-code-action@d1f58ad5e6f4d2b79547e63e37c2116064135896 # v1.0.277
              with:
                  claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

                  # This is an optional setting that allows Claude to read CI results on PRs
                  additional_permissions: |
                      actions: read

                  # Optional: Add claude_args to customize behavior and configuration
                  # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
                  # or https://code.claude.com/docs/en/cli-reference for available options
                  # or https://github.com/anthropics/claude-code-action/blob/main/docs/configuration.md#custom-tools
                  # --strict-mcp-config: load only the MCP servers of --mcp-config and the action's own, never the ones in .mcp.json.
                  claude_args: |
                      --strict-mcp-config
                      --mcp-config '{"mcpServers":{"hopper":{"type":"http","url":"https://hopper.workleap.design/mcp"}}}'
                      --allowedTools "
                        Bash(pnpm lint:*),
                        Bash(pnpm build:*),
                        Bash(pnpm test:*),
                        Bash(pnpm test run:*),
                        Bash(pnpm tsc:*),
                        Read,Write,Grep,Glob,Skill,
                        mcp__github_inline_comment__*,
                        mcp__hopper__*,
                        mcp__hopper__get_guide,
                        mcp__hopper__get_component_doc,
                        mcp__hopper__validate_hopper_code,
                        mcp__hopper__get_design_tokens,
                        mcp__hopper__get_icons
                        "
                      --append-system-prompt "
                        **CRITICAL**: Follow the branch name requirements as specified in the CLAUDE.md file.
                        "
                      --verbose
