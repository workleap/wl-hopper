name: CI

# Pnpm setup based on https://github.com/pnpm/action-setup#use-cache-to-reduce-installation-time

on:
    push:
        branches: [ "main" ]
    pull_request:
        branches: [ "main" ]

env:
    CI: true

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout code
                uses: actions/checkout@v7

            -   name: Check publish workflow hardening
                # The publish job holds the npm publishing identity and the agent job runs untrusted content: neither
                # may use the pnpm store shared with other jobs, and a Turborepo restore must use a prefix that only
                # its own workflow writes.
                run: |
                    setup=.github/composite-actions/setup/action.yml
                    publish=.github/workflows/changeset.yml
                    if ! grep -qF 'default: "false"' "$setup"; then
                        echo "::error file=$setup::The setup action must not cache the pnpm store by default."
                        exit 1
                    fi
                    if grep -nE "^ +cache:|actions/cache" "$publish" .github/workflows/claude.yml; then
                        echo "::error::The publish and agent workflows must not use an Actions cache."
                        exit 1
                    fi
                    if ! grep -qF "pnpm i --frozen-lockfile --ignore-scripts" "$publish"; then
                        echo "::error file=$publish::The publish workflow must install with --frozen-lockfile --ignore-scripts."
                        exit 1
                    fi
                    if ! grep -qE "^ +pnpm_config_cache_dir:" "$publish"; then
                        echo "::error file=$publish::The publish workflow must install with its own empty pnpm cache directory."
                        exit 1
                    fi
                    if grep -nE -- "-turbo(repo)?- *$" .github/workflows/*.yml; then
                        echo "::error::A Turborepo cache must be restored by a prefix that only its own workflow writes."
                        exit 1
                    fi

            -   name: Setup Node and PNPM
                uses: ./.github/composite-actions/setup
                with:
                    cache: true

            -   name: Install dependencies
                run: pnpm i --frozen-lockfile

            -   name: Restore Turborepo cache
                id: cache-turborepo-restore
                uses: actions/cache/restore@v6
                with:
                    key: ${{ runner.os }}-turborepo-ci-${{ github.sha }}
                    restore-keys: |
                        ${{ runner.os }}-turborepo-ci-
                    path: .turbo

            -   name: Generate documentation
                run: pnpm doc:generate

            -   name: Build packages
                run: pnpm build:pkg

            -   name: Build sample apps
                run: pnpm build:apps

            -   name: Build AI docs and MCP server
                run: pnpm build:mcp

            -   name: Build the agent Skill
                run: pnpm build:skills

            -   name: Lint
                run: pnpm lint

            -   name: Test
                run: pnpm test

            -   name: Save Turborepo cache
                id: cache-turborepo-save
                if: always() && steps.cache-turborepo-restore.outputs.cache-hit != 'true'
                uses: actions/cache/save@v6
                with:
                    key: ${{ steps.cache-turborepo-restore.outputs.cache-primary-key }}
                    path: .turbo
