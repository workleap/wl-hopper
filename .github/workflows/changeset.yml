name: Changesets

on:
    push:
        branches: [ "main" ]
env:
    CI: true

jobs:
    version:
        runs-on: ubuntu-latest
        permissions:
            id-token: write # OIDC for npm Trusted Publishing
            contents: write
            pull-requests: write

        steps:
            -   name: Checkout code
                uses: actions/checkout@v7

            # This job holds the npm publishing identity, so it installs from the lockfile only:
            # the pnpm store is not restored from the setup action and no lifecycle script runs.
            -   name: Setup Node and PNPM
                uses: ./.github/composite-actions/setup

            -   name: Install dependencies
                run: pnpm i --frozen-lockfile --ignore-scripts
                env:
                    # pnpm/setup restores a lockfile verification log that other jobs can save, whatever its
                    # inputs. An empty pnpm cache directory makes pnpm ignore it and verify the lockfile again.
                    pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-publish-cache

            -   name: Create release Pull Request or publish to NPM
                uses: changesets/action@v2
                with:
                    commit-message: "ci(changesets): version packages"
                    pr-title: "Changeset: New Version"
                    publish-script: pnpm run ci-release
                    version-script: "pnpm run ci-version-packages"
                    github-token: ${{ secrets.GITHUB_TOKEN }}
