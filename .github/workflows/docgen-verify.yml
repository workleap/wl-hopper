# Temporary workflow: proves the rewritten `generateComponentData.ts` produces output that is
# byte-identical to the previous implementation, and measures both. Delete before merging.
name: Docgen verification

on:
    workflow_dispatch:
    pull_request:
        branches: [ "main" ]

env:
    CI: true

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout code
                uses: actions/checkout@v4
                with:
                    fetch-depth: 0

            -   name: Setup Node and PNPM
                uses: ./.github/composite-actions/setup

            -   name: Install dependencies
                run: pnpm i --frozen-lockfile

            -   name: Generate baseline with the previous implementation
                run: |
                    set -euo pipefail
                    BASE_SHA="${{ github.event.pull_request.base.sha }}"
                    if [ -z "$BASE_SHA" ]; then BASE_SHA="origin/main"; fi
                    echo "Baseline script from $BASE_SHA"

                    SCRIPT="$GITHUB_WORKSPACE/apps/docs/scripts/generateComponentData.ts"

                    cp "$SCRIPT" /tmp/candidate-script.ts
                    git show "$BASE_SHA:apps/docs/scripts/generateComponentData.ts" > "$SCRIPT"

                    rm -rf "$GITHUB_WORKSPACE/apps/docs/datas/components"
                    START=$(date +%s)
                    (cd "$GITHUB_WORKSPACE/apps/docs" && pnpm generate:componentData) > /tmp/baseline.log 2>&1 \
                        || (tail -50 /tmp/baseline.log; cp /tmp/candidate-script.ts "$SCRIPT"; exit 1)
                    END=$(date +%s)
                    echo "BASELINE_SECONDS=$((END - START))" >> "$GITHUB_ENV"
                    mv "$GITHUB_WORKSPACE/apps/docs/datas/components" /tmp/baseline

                    cp /tmp/candidate-script.ts "$SCRIPT"
                    echo "Baseline took $((END - START))s, $(ls /tmp/baseline | wc -l) files"

            -   name: Compare every alias mode against the baseline
                run: |
                    set -uo pipefail
                    FAILED=""
                    touch /tmp/summary.md
                    for MODE in none additive virtual-temp; do
                        echo "::group::mode=$MODE"
                        rm -rf apps/docs/datas/components
                        START=$(date +%s)
                        (cd apps/docs && HOPPER_DOCGEN_ALIAS_MODE="$MODE" pnpm generate:componentData) > "/tmp/$MODE.log" 2>&1
                        RUN_STATUS=$?
                        END=$(date +%s)
                        DURATION=$((END - START))

                        if [ "$RUN_STATUS" -ne 0 ]; then
                            echo "mode=$MODE CRASHED after ${DURATION}s"
                            tail -50 "/tmp/$MODE.log"
                            FAILED="$FAILED $MODE(crash)"
                            echo "::endgroup::"
                            continue
                        fi

                        COMPARE_OUTPUT="$(node .github/workflows/scripts/compareDocgenOutput.mjs /tmp/baseline apps/docs/datas/components)"
                        echo "$COMPARE_OUTPUT"
                        RESULT="$(echo "$COMPARE_OUTPUT" | sed -n 's/^RESULT: //p')"

                        case "$RESULT" in
                            IDENTICAL*|EQUIVALENT*) ;;
                            *) FAILED="$FAILED $MODE(diff)" ;;
                        esac

                        # Second run of the same mode, to prove the new implementation is itself
                        # deterministic rather than accidentally matching once.
                        mv apps/docs/datas/components "/tmp/$MODE-first"
                        (cd apps/docs && HOPPER_DOCGEN_ALIAS_MODE="$MODE" pnpm generate:componentData) > "/tmp/$MODE-2.log" 2>&1
                        REPEAT="$(node .github/workflows/scripts/compareDocgenOutput.mjs "/tmp/$MODE-first" apps/docs/datas/components | sed -n 's/^RESULT: //p')"
                        if [ "$REPEAT" != "IDENTICAL" ]; then
                            echo "mode=$MODE is not deterministic across runs: $REPEAT"
                            FAILED="$FAILED $MODE(nondeterministic)"
                        fi
                        rm -rf "/tmp/$MODE-first"

                        DIRTY="$(git status --porcelain)"
                        LEAKED="$(find packages -name '*.temp.*' -print)"
                        if [ -n "$DIRTY" ] || [ -n "$LEAKED" ]; then
                            echo "Working tree not clean: $DIRTY $LEAKED"
                            FAILED="$FAILED $MODE(dirty)"
                        fi

                        echo "mode=$MODE ${DURATION}s $RESULT (repeat: $REPEAT)"
                        echo "| \`$MODE\` | ${DURATION}s | $RESULT | $REPEAT |" >> /tmp/summary.md
                        echo "::endgroup::"
                    done

                    {
                        echo "## Docgen verification"
                        echo ""
                        echo "Baseline (previous implementation): **${BASELINE_SECONDS}s**, $(ls /tmp/baseline | wc -l) files."
                        echo ""
                        echo "| alias mode | duration | output vs baseline | repeat run |"
                        echo "|---|---|---|---|"
                        cat /tmp/summary.md
                    } >> "$GITHUB_STEP_SUMMARY"

                    if [ -n "$FAILED" ]; then
                        echo "Modes with a problem:$FAILED"
                    fi

                    # Passes when a mode reproduces the baseline data exactly — byte-identical, or
                    # equivalent with only JSON key order differing — and is stable across runs.
                    if grep -qE "IDENTICAL|EQUIVALENT" /tmp/summary.md; then
                        exit 0
                    fi

                    echo "No alias mode reproduced the baseline."
                    exit 1
