name: Changesets

on:
    push:
        branches: [ "main" ]
env:
    CI: true

jobs:
    version:
        runs-on: ubuntu-latest
        permissions:
            id-token: write # OIDC for npm Trusted Publishing
            contents: write
            pull-requests: write

        steps:
            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: Setup Node and PNPM
                uses: ./.github/composite-actions/setup

            -   name: Install dependencies
                run: pnpm i --frozen-lockfile

            # changesets/action@v2 is required by @changesets/cli 3 (v1 only supports cli 2).
            # All inputs were renamed to kebab-case in v2, and .npmrc/NPM_TOKEN handling was
            # removed — which is fine here, publishing goes through OIDC Trusted Publishing.
            -   name: Create release Pull Request or publish to NPM
                uses: changesets/action@v2
                with:
                    commit-message: "ci(changesets): version packages"
                    pr-title: "Changeset: New Version"
                    publish-script: pnpm run ci-release
                    version-script: "pnpm run ci-version-packages"
                    github-token: ${{ secrets.GITHUB_TOKEN }}
