name: Claude Code Review

on:
    pull_request:
        types: [opened, synchronize, ready_for_review, reopened]

jobs:
    claude-review:
        # Optional: Filter by PR author
        # if: |
        #   github.event.pull_request.user.login == 'external-contributor' ||
        #   github.event.pull_request.user.login == 'new-developer' ||
        #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

        runs-on: workleap
        permissions:
            contents: read
            pull-requests: write
            issues: write
            id-token: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1

            # The review plugin is pinned to a commit here, in the workflow file, so its content only changes through a reviewed commit.
            # The marketplace is written outside the checkout, where a pull request cannot change it.
            - name: Pin the code-review plugin
              run: |
                  mkdir -p "$RUNNER_TEMP/claude-plugins/.claude-plugin"
                  cat > "$RUNNER_TEMP/claude-plugins/.claude-plugin/marketplace.json" <<'EOF'
                  {
                      "name": "wl-hopper-ci",
                      "owner": { "name": "Workleap" },
                      "plugins": [
                          {
                              "name": "code-review",
                              "source": {
                                  "source": "git-subdir",
                                  "url": "https://github.com/anthropics/claude-plugins-official.git",
                                  "path": "plugins/code-review",
                                  "sha": "9780cf407f5593727b668bae95a0c4ae2e0de1ae"
                              }
                          }
                      ]
                  }
                  EOF

            - name: Run Claude Code Review
              id: claude-review
              uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
              with:
                  claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                  plugin_marketplaces: ${{ runner.temp }}/claude-plugins
                  plugins: "code-review@wl-hopper-ci"
                  prompt: |
                      /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
                  # --strict-mcp-config: load only the MCP servers of --mcp-config and the action's own, never the ones in .mcp.json.
                  claude_args: |
                      --strict-mcp-config
                      --mcp-config '{"mcpServers":{"hopper":{"type":"http","url":"https://hopper.workleap.design/mcp"}}}'
                      --allowedTools "
                        Read,Write,Grep,Glob,Skill,
                        mcp__github_inline_comment__*,
                        mcp__hopper__get_guide,
                        mcp__hopper__get_component_doc,
                        mcp__hopper__validate_hopper_code,
                        mcp__hopper__get_design_tokens,
                        mcp__hopper__get_icons
                        "
                      --verbose
